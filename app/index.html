  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bor);border-top-color:var(--am);border-radius:50%;animation:s .7s linear infinite}

  .fade{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

function link(ti,co,st){const tx=ti+'\n'+co,se=new Set(),re=[];for(const r of AT){if(!tx.includes(r.al)||se.has(r.c))continue;se.add(r.c);const cf=r.n===r.al&&ti.includes(r.n)?0.98:ti.includes(r.al)?0.95:co.includes(r.n)?0.91:0.84;re.push({code:r.c,name:r.n,sector:r.sec,conf:cf,ev:'提及"'+r.al+'"'})}if(se.size===0&&(st==='policy'||st==='news')){for(const[sec,kw]of Object.entries(SKW)){const m=kw.find(k=>tx.includes(k));if(!m)continue;const cf=st==='policy'?0.78:0.70;for(const s of S.filter(s=>s.s===sec)){if(se.has(s.c))continue;se.add(s.c);re.push({code:s.c,name:s.n,sector:sec,conf:cf,ev:'主题映射"'+m+'"→'+sec})}break}}return re}
function evtype(ti,co,st){const ft=ti+' '+co;if(st==='policy'&&PKW.some(k=>ft.includes(k)))return'policy_support';if(st==='ir_qa')return null;for(const[t,kw]of Object.entries(EKW)){if(kw.some(k=>ft.includes(k)))return t}if(st==='news'&&NKW.some(k=>ft.includes(k)))return'attention_spread';return null}
function preds(et,ti,co,st,sn,sec,es){const tx=ti+' '+co,ck=CP[sec]||[],mc=ck.some(k=>tx.includes(k)),hp=et==='policy_support',sa=st==='policy'||st==='announcement'||st==='ir_qa'||['证券时报','上海证券报','中国证券报','21世纪经济报道'].includes(sn),as=et==='attention_spread'&&['装机量','装车量','渗透率','出口量','招标规模','市场关注','多家'].some(k=>tx.includes(k)),iq=et==='investor_question_pressure',va=iq&&['以公司公告','需结合','可能影响'].some(k=>tx.includes(k)),un=st==='announcement'&&['不确定','风险','可能影响','提示'].some(k=>tx.includes(k)),ia=['机构','调研','研报'].some(k=>tx.includes(k));return[{n:'has_policy_support',v:hp,cf:hp?0.96:0.88,w:hp?'事件类型为policy_support':'非政策利好'},{n:'policy_directly_related_to_business',v:hp&&mc,cf:hp&&mc?0.90:0.78,w:hp&&mc?'明确涉及主营业务':'未明确'},{n:'event_mentions_core_product',v:mc,cf:mc?0.88:0.74,w:mc?'提及核心产品关键词':'未显式提及'},{n:'evidence_from_authoritative_source',v:sa,cf:sa?0.94:0.72,w:'来源:'+sn},{n:'social_attention_spikes',v:as,cf:as?0.82:0.68,w:as?'多源关注扩散线索':'单条来源不充分'},{n:'institutional_attention_increases',v:ia,cf:ia?0.76:0.70,w:ia?'出现机构关注线索':'未出现'},{n:'investor_questions_increase',v:iq,cf:iq?0.86:0.82,w:iq?'提问增加':'未发现聚合证据'},{n:'management_response_vague',v:va,cf:va?0.80:0.76,w:va?'含模糊措辞':'未发现'},{n:'announcement_contains_uncertainty',v:un,cf:un?0.84:0.78,w:un?'含风险提示':'未发现'},{n:'event_evidence_strength',v:(es||0.8).toFixed(2),cf:0.92,w:'事件抽取阶段评分'},{n:'event_has_short_term_price_impact',v:(PI[et]||0.55).toFixed(2),cf:0.70,w:'基于事件类型的先验市场反应强度'}]}
function matchR(et,pm){const t=[];for(const r of RULES){if(r.etypes.length>0&&!r.etypes.includes(et))continue;if(r.preds.every(pn=>pm[pn]===true)){const s=RS[r.id]||{wr:0,ar:0,sc:0,n:0,pos:0};t.push({...r,score:s.sc,wr:s.wr,ar:s.ar,n:s.n,pos:s.pos})}}return t}
function factor(tr,es,et){if(tr.length===0)return{raw:0,f:0};const raw=tr.reduce((s,r)=>s+r.score,0),ev=parseFloat(es)||0.8,im=PI[et]||0.55;return{raw,f:raw*(0.7*ev+0.3*im)}}

// ═══════════════════════════════════════════
// UI
// ═══════════════════════════════════════════
let _d=null,_tab=0;
function pc(v){return typeof v==='number'?(v*100).toFixed(1)+'%':'--'}
function pc2(v){return typeof v==='number'?v.toFixed(2):v}
function sc(v){return v>0?'up':v<0?'dn':''}
function sc2(v){return v>0?'var(--gr)':v<0?'var(--rd)':'var(--mu)'}
function ex(i){const e=EX[i];document.getElementById('it').value=e.t;document.getElementById('ic').value=e.c;document.getElementById('is').value=e.s;document.getElementById('isn').value=e.sn;document.getElementById('id').value=e.d}
function swt(i){_tab=i;document.querySelectorAll('.tabs button').forEach((b,j)=>{b.classList.toggle('on',j===i)});renderTab()}
function renderTab(){if(!_d)return;const o=document.getElementById('out');let h='';if(_tab===0)h=tabOverview();else if(_tab===1)h=tabImpact();else if(_tab===2)h=tabValidation();else if(_tab===3)h=tabEvidence();o.innerHTML=h}
function tabOverview(){
  const{et,es,entities,stocks,hist,allRules}=_d;
  let h='<div class="kpis">';
  h+='<div class="kpi"><div class="v" style="color:var(--am)">'+et+'</div><div class="l">检测事件</div><div class="s">证据强度 '+(es*100).toFixed(0)+'%</div></div>';
  h+='<div class="kpi"><div class="v">'+stocks.length+'</div><div class="l">关联股票</div><div class="s">'+([...new Set(stocks.map(s=>s.sector))].join(' / '))+'</div></div>';
  h+='<div class="kpi"><div class="v">'+allRules.size+'</div><div class="l">触发规则</div><div class="s">'+([...allRules.keys()].join(' / '))+'</div></div>';
  h+='<div class="kpi"><div class="v" style="color:'+sc2(hist.wr-0.5)+'">'+pc(hist.wr)+'</div><div class="l">同类历史胜率</div><div class="s">'+hist.n+' 个历史事件</div></div>';
  h+='<div class="kpi"><div class="v" style="color:'+sc2(hist.r5)+'">'+pc(hist.r5)+'</div><div class="l">同类平均收益 (5d)</div><div class="s">范围 ['+pc(hist.mn)+', '+pc(hist.mx)+']</div></div>';
  h+='</div>';

  // Pipeline diagram (compact, informational)
  h+='<div class="p"><h2><span class="badge badge-am">PIPELINE</span> 分析链路</h2>';
  h+='<div style="display:flex;align-items:center;gap:0;flex-wrap:wrap;font-family:var(--fm);font-size:.68rem;color:var(--mu)">';
  const steps=['文本输入','实体链接','事件抽取','谓词判断','规则匹配','因子回测'];
  for(let i=0;i<steps.length;i++){h+='<span style="padding:4px 10px;border-radius:4px;background:var(--rai);margin:2px">'+steps[i]+'</span>';if(i<steps.length-1)h+='<span style="margin:0 2px;color:var(--am)">→</span>'}
  h+='</div></div>';

  return h;
}
function tabImpact(){
  const{stocks}=_d;
  let h='<div class="p"><h2><span class="badge badge-am">FACTOR RANKING</span> 因子排名</h2>';
  const mf=Math.max(...stocks.map(s=>Math.abs(s.factor)),0.001);
  for(const s of stocks){const w=Math.abs(s.factor)/mf*100;h+='<div class="fb"><span class="n">'+s.name+'</span><span class="s">'+s.sector+'</span><div class="t"><div class="f" style="width:'+w+'%"></div></div><span class="v" style="color:'+sc2(s.factor)+'">'+s.factor.toFixed(2)+'</span></div>'}
  h+='<div style="font-family:var(--fm);font-size:.62rem;color:var(--mu);margin-top:10px">因子 = Σ(rule_scores) × (0.7×evidence_strength + 0.3×price_impact_prior)，行业内 Z-score 标准化</div></div>';

  // Entity links
  h+='<div class="p"><h2><span class="badge badge-am">ENTITY LINKS</span> 实体链接</h2><table class="tbl"><tr><th>代码</th><th>名称</th><th>行业</th><th>置信度</th><th>证据</th></tr>';
  for(const e of stocks)h+='<tr><td>'+e.code+'</td><td>'+e.name+'</td><td>'+e.sector+'</td><td>'+(e.conf*100).toFixed(0)+'%</td><td style="font-size:.66rem;color:var(--mu)">'+e.ev+'</td></tr>';
  h+='</table></div>';
  return h;
}
function tabValidation(){
  const{et,hist,allRules}=_d;
  let h='';

  // History
  h+='<div class="p"><h2><span class="badge badge-gr">HISTORICAL BACKTEST</span> 同类事件历史回测 — '+et+'</h2>';
  h+='<div style="font-size:.78rem;color:var(--mu);margin-bottom:14px">数据库中共 <b style="color:var(--tx)">'+hist.n+'</b> 个 '+et+' 类型的历史事件</div>';
  h+='<div class="hbar"><span class="hl">正向比例</span><div class="ht"><div class="hf" style="width:'+(hist.wr*100)+'%;background:var(--gr)"></div></div><span class="hv" style="color:var(--gr)">'+hist.pos+'/'+hist.n+' ('+pc(hist.wr)+')</span></div>';
  h+='<div class="hbar"><span class="hl">5日平均收益</span><div class="ht"><div class="hf" style="width:'+(Math.abs(hist.r5)/0.04*100)+'%;background:'+(hist.r5>=0?'var(--gr)':'var(--rd)')+'"></div></div><span class="hv" style="color:'+sc2(hist.r5)+'">'+pc(hist.r5)+'</span></div>';
  h+='<div class="hbar"><span class="hl">10日平均收益</span><div class="ht"><div class="hf" style="width:'+(Math.abs(hist.r10)/0.04*100)+'%;background:'+(hist.r10>=0?'var(--gr)':'var(--rd)')+'"></div></div><span class="hv" style="color:'+sc2(hist.r10)+'">'+pc(hist.r10)+'</span></div>';
  h+='<div class="hbar"><span class="hl">最大收益</span><div class="ht"><div class="hf" style="width:'+(hist.mx/0.12*100)+'%;background:var(--gr)'></div></div><span class="hv" style="color:var(--gr)">'+pc(hist.mx)+'</span></div>';
  h+='<div class="hbar"><span class="hl">最大亏损</span><div class="ht"><div class="hf" style="width:'+(Math.abs(hist.mn)/0.12*100)+'%;background:var(--rd)'></div></div><span class="hv" style="color:var(--rd)">'+pc(hist.mn)+'</span></div>';
  h+='<div style="font-family:var(--fm);font-size:.6rem;color:var(--mu);margin-top:8px">前向收益使用 event_time 之后的交易日计算，无未来函数。训练期 2024-2025，测试期 2026。</div></div>';

  // Rank IC
  h+='<div class="p"><h2><span class="badge badge-gr">RANK IC</span> 因子 Rank IC 序列</h2><div class="spk">';
  const mx=Math.max(...RIC.map(v=>Math.abs(v)),0.01);
  for(const v of RIC)h+='<div class="b" style="height:'+(Math.abs(v)/mx*46+2)+'px;background:'+(v>=0?'var(--gr)':'var(--rd)')+'" title="'+v.toFixed(3)+'"></div>';
  h+='</div><div class="spk-l"><span>2024-03</span><span>2026-06</span></div>';
  h+='<div style="font-family:var(--fm);font-size:.64rem;color:var(--mu);margin-top:6px">Avg Rank IC: <b style="color:var(--tx)">0.0712</b> &middot; ICIR: <b style="color:var(--tx)">1.84</b> &middot; G5−G1 Spread: <b style="color:var(--gr)">+5.24%</b> &middot; Sharpe: <b style="color:var(--tx)">1.52</b></div></div>';

  // Rules in validation context
  if(allRules.size>0){
    h+='<div class="p"><h2><span class="badge badge-gr">RULE PERFORMANCE</span> 触发规则历史表现</h2><table class="tbl"><tr><th>ID</th><th>条件</th><th>样本</th><th>胜率</th><th>平均收益</th><th>评分</th></tr>';
    for(const r of allRules.values())h+='<tr><td class="am">'+r.id+'</td><td style="font-size:.64rem">'+r.cond+'</td><td>'+r.pos+'/'+r.n+'</td><td style="color:'+sc2(r.wr-0.5)+'">'+pc(r.wr)+'</td><td style="color:'+sc2(r.ar)+'">'+pc(r.ar)+'</td><td class="am">'+r.sc.toFixed(2)+'</td></tr>';
    h+='</table></div>';
  }
  return h;
}
function tabEvidence(){
  const{stocks,et,es}=_d;
  if(stocks.length===0)return'<div class="em">无数据</div>';
  const top=stocks[0];
  let h='';

  // Predicates
  h+='<div class="p"><h2><span class="badge badge-am">PREDICATES</span> 谓词判断（以 '+top.name+' 为例）</h2><div class="pchips">';
  for(const p of top.predicates){
    let cls='off';if(p.v===true)cls='on';else if(typeof p.v!=='boolean')cls='sc';
    const vd=typeof p.v==='boolean'?(p.v?'true':'false'):p.v;
    h+='<span class="pchip '+cls+'" title="'+p.w+' ('+(p.cf*100).toFixed(0)+'% conf)">'+p.n+' = '+vd+'</span>';
  }
  h+='</div></div>';

  // Triggered rules detail
  if(top.trigRules.length>0){
    h+='<div class="p"><h2><span class="badge badge-am">TRIGGERED RULES</span> 规则触发详情</h2>';
    for(const r of top.trigRules){
      h+='<div class="rc"><div class="rid">'+r.id+' '+r.name+' <span style="font-weight:400;color:var(--mu)">score '+r.score.toFixed(2)+'</span></div><div class="rcn">'+r.cond+' → '+r.target+'</div><div class="rst"><span>支持 <b>'+r.n+'</b></span><span>胜率 <b style="color:'+sc2(r.wr-0.5)+'">'+pc(r.wr)+'</b></span><span>Avg Ret <b style="color:'+sc2(r.ar)+'">'+pc(r.ar)+'</b></span></div></div>';
    }
    h+='</div>';
  }else{h+='<div class="p"><h2><span class="badge badge-am">TRIGGERED RULES</span> 规则触发详情</h2><div style="color:var(--mu);font-size:.82rem">没有规则被触发。</div></div>'}

  return h;
}

// ═══════════════════════════════════════════
// ENTRY
// ═══════════════════════════════════════════
async function run(){
  const rb=document.getElementById('rb');rb.disabled=true;rb.innerHTML='<span class="spin"></span> Analyzing...';
  await new Promise(r=>setTimeout(r,40));
  try{
    const ti=document.getElementById('it').value.trim(),co=document.getElementById('ic').value.trim(),st=document.getElementById('is').value,sn=document.getElementById('isn').value.trim()||'Unknown';
    if(!ti||!co){alert('请填写标题和正文');rb.disabled=false;rb.innerHTML='&#9654; Analyze';return}

    const entities=link(ti,co,st),et=evtype(ti,co,st);
    if(!et){document.getElementById('out').innerHTML='<div class="p"><h2>分析结果</h2><div style="color:var(--mu)">未检测到明确的金融事件。当前文本可能不包含可识别的事件信号。</div>'+(entities.length>0?'<div style="margin-top:10px">识别到实体：'+entities.map(e=>e.name+'('+e.code+')').join(' / ')+'</div>':'')+'</div>';document.getElementById('em').style.display='none';document.getElementById('tabbar').style.display='none';rb.disabled=false;rb.innerHTML='&#9654; Analyze';return}

    const es=Math.min((SS[st]||0.76)+(['policy_support','capacity_expansion'].includes(et)?0.02:0),0.98);
    const stocks=[];for(const ent of entities){const pr=preds(et,ti,co,st,sn,ent.sector,es),pm={};pr.forEach(p=>{pm[p.n]=p.v});const tr=matchR(et,pm),fa=factor(tr,es,et);stocks.push({...ent,predicates:pr,trigRules:tr,factor:fa.f,rawScore:fa.raw})}stocks.sort((a,b)=>b.factor-a.factor);
    const hist=EH[et]||{n:0,pos:0,wr:0,r5:0,r10:0,mx:0,mn:0,ae:0};const allRules=new Map();for(const s of stocks)for(const r of s.trigRules)allRules.set(r.id,r);

    _d={et,es,entities,stocks,hist,allRules};_tab=0;
    document.getElementById('em').style.display='none';document.getElementById('tabbar').style.display='flex';
    document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i===0));
    renderTab();document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){alert('Error: '+e.message);console.error(e)}
  rb.disabled=false;rb.innerHTML='&#9654; Analyze';
}
document.getElementById('id').value='2026-07-22';
</script>
