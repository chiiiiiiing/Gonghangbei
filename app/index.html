<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AlphaLens 单篇金融文本驱动的行业同比增速预测与分析报告">
  <title>AlphaLens · 新文本行业景气预测</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="/vendor/plotly.min.js"></script>
  <script defer src="/vendor/lucide.min.js"></script>
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="AlphaLens 首页">
        <span class="brand-mark">A</span>
        <span>Alpha<strong>Lens</strong></span>
      </a>
      <nav class="nav-tabs" aria-label="研究视图">
        <button class="nav-tab active" data-view="macroView" type="button">宏观预测</button>
        <button class="nav-tab" data-view="liveView" type="button">新文本预测</button>
        <button class="nav-tab" data-view="auditView" type="button">研究审计</button>
      </nav>
      <div class="service-status"><span class="status-dot" id="statusDot"></span><span id="statusText">正在连接本地研究服务</span></div>
    </div>
  </header>

  <main class="page-shell">
    <section class="view active" id="macroView">
      <div id="macroContent"><div class="loading-surface">正在读取行业同比预测研究</div></div>
    </section>

    <section class="view" id="liveView">
      <div class="workspace">
        <section class="surface editor-surface">
          <div class="surface-heading">
            <div><h1>新文本行业景气预测</h1><p class="surface-subtitle">仅使用本次输入文本的结构化证据，参考冻结历史规则与模型，给出行业增加值同比预测和完整分析报告</p></div>
            <div class="example-picker" aria-label="示例文本">
              <button class="quiet-button" data-example="0" type="button">储能政策</button>
              <button class="quiet-button" data-example="1" type="button">锂电公告</button>
              <button class="quiet-button" data-example="2" type="button">光伏新闻</button>
            </div>
          </div>
          <div class="field">
            <label for="title">标题</label>
            <input id="title" type="text" placeholder="输入政策、公告、新闻或互动问答标题">
          </div>
          <div class="field grow-field">
            <label for="content">正文</label>
            <textarea id="content" placeholder="输入首次公开的原始正文或可核验摘要"></textarea>
          </div>
          <div class="form-grid">
            <div class="field"><label for="sourceType">来源类型</label><select id="sourceType"><option value="policy">政策</option><option value="announcement">公告</option><option value="news">新闻</option><option value="ir_qa">互动问答</option><option value="auto">自动识别</option></select></div>
            <div class="field"><label for="sourceName">来源名称</label><input id="sourceName" type="text" placeholder="例如：国家能源局"></div>
            <div class="field"><label for="eventDate">首次公开日期</label><input id="eventDate" type="date"></div>
            <div class="field"><label for="sourceUrl">正文链接</label><input id="sourceUrl" type="url" placeholder="https://..."><span class="field-note">填入链接后系统自动抓取全文供 AI 阅读；抓取失败或仅填摘要时，按文本完整度自动降低置信度</span></div>
          </div>
        </section>

        <aside class="surface run-surface">
          <div class="surface-heading compact"><div><h2>运行配置</h2></div><span class="model-chip">V4 Flash</span></div>
          <div class="field">
            <label>运行入口</label>
            <div class="segmented">
              <button class="segment active" data-run-mode="live" type="button"><i data-lucide="sparkles"></i>实时 AI</button>
              <button class="segment" data-run-mode="replay" type="button"><i data-lucide="archive-restore"></i>冻结回放</button>
            </div>
          </div>
          <div class="field"><label for="analysisMode">分析模式</label><select id="analysisMode"><option value="hybrid">大模型候选 + 规则校验</option></select></div>
          <div class="field" id="apiKeyField">
            <label for="apiKey">DeepSeek API Key</label>
            <div class="secret-input"><input id="apiKey" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="sk-..."><button id="toggleKey" class="icon-button" title="显示或隐藏 API Key" type="button"><i data-lucide="eye"></i></button></div>
            <span class="field-note">仅随本次请求传输，不保存</span>
          </div>
          <div class="connection-state neutral" id="connectionStatus"><span class="mini-dot"></span><span>等待凭证</span></div>
          <div class="action-row">
            <button class="secondary-button" id="checkApiButton" type="button"><i data-lucide="plug-zap"></i>检查连接</button>
            <button class="primary-button" id="runButton" type="button"><i data-lucide="play"></i>开始分析</button>
          </div>
          <div class="run-progress" id="runState"><span class="spinner"></span><span>正在执行结构化抽取与门控</span></div>
          <p class="disclaimer">本报告仅供研究参考，不构成投资建议</p>
        </aside>
      </div>
      <div id="result" aria-live="polite"></div>
    </section>

    <section class="view" id="historyView" aria-hidden="true"><div id="historyContent"><div class="loading-surface">正在读取原因子研究审计</div></div></section>
    <section class="view" id="auditView"><div id="auditContent"><div class="loading-surface">正在读取研究审计</div></div></section>
  </main>

  <footer>AlphaLens 是量化研究助手，不预测股票价格，不提供投资建议。</footer>
</body>
</html>
