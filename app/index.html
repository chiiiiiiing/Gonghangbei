<script src="/vendor/plotly.min.js"></script>
<style>

  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;letter-spacing:0}
  button,input,select,textarea{font:inherit;letter-spacing:0} button{cursor:pointer}

  .view-tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px;margin-bottom:18px}.view-tab{height:34px;border:0;border-radius:4px;background:transparent;color:var(--muted);padding:0 16px;font-size:13px;font-weight:650}.view-tab.active{background:var(--blue);color:#fff}.view{display:none}.view.active{display:block}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}.input-panel{padding:22px}.panel-title{font-size:15px;font-weight:700;margin:0 0 16px}.label{display:block;font-size:12px;font-weight:650;color:#46515d;margin:0 0 6px}

  textarea{min-height:180px;padding:13px;resize:vertical}.field{margin-bottom:13px}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta-grid input,.meta-grid select{height:40px;padding:0 10px}.url-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}

  .section{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:8px}.section-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.section-head h2{font-size:15px;margin:0}.scope{font-size:11px;color:var(--muted)}.section-body{padding:18px}

  .trace{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.trace-step{padding:12px;border:1px solid var(--line);border-radius:6px}.trace-step b{display:block;font-size:12px;margin-bottom:5px}.trace-step span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:120px 64px minmax(80px,1fr) 72px;gap:10px;align-items:center;font-size:12px}.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-sector{color:var(--muted)}.bar-track{height:10px;background:#edf0f3;border-radius:3px;overflow:hidden}.bar-fill{height:100%;background:var(--blue)}.bar-value{font-family:var(--mono);text-align:right}
  .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:680px}th{background:#f7f8fa;color:#56616c;text-align:left;font-weight:650}th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}td.mono{font-family:var(--mono)}.good{color:var(--green);font-weight:650}.warn{color:var(--amber);font-weight:650}

  .download{border:1px solid var(--line);border-radius:6px;background:#fff;padding:7px 11px;color:#46515d;font-size:12px}.download:hover{border-color:var(--blue);color:var(--blue)}
  .run-state{display:none;align-items:center;gap:9px;margin-top:12px;padding:9px 11px;background:var(--blue-soft);color:#35546d;border-radius:6px;font-size:12px}.run-state.on{display:flex}.spinner{width:14px;height:14px;border:2px solid #9dc4df;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .source-link{color:var(--blue);text-decoration:none}.source-link:hover{text-decoration:underline}.entity-switch{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.entity-button{border:1px solid var(--line);border-radius:5px;background:#fff;color:#46515d;padding:7px 10px;font-size:12px}.entity-button.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}

  .history-title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}.history-title h1{font-size:18px;margin:0}.history-title p{font-size:12px;color:var(--muted);margin:3px 0 0}.history-date{font-family:var(--mono);font-size:11px;color:var(--muted)}.metric-note{font-size:11px;color:var(--muted);margin-top:10px}.negative{color:var(--red)}
  .config-block{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line)}.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border:1px solid var(--line);border-radius:6px;background:#f7f8fa}.mode-button{height:34px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:12px;font-weight:650}.mode-button.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}.side .field input,.side .field select{height:40px;padding:0 10px}.config-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#46515d;font-size:12px;font-weight:650}.secondary:hover{border-color:var(--blue);color:var(--blue)}.connection{margin-top:10px;padding:9px 10px;border-radius:5px;background:#f7f8fa;color:var(--muted);font-size:11px}.connection.ok{background:var(--green-soft);color:var(--green)}.connection.fail{background:var(--red-soft);color:var(--red)}.runtime-meta{display:grid;gap:7px;font-size:11px;color:var(--muted)}.runtime-meta div{display:flex;justify-content:space-between;gap:12px}.runtime-meta b{color:#46515d;font-weight:650}.replay-banner{margin-top:18px;padding:12px 14px;border:1px solid #e7c775;border-left:4px solid var(--amber);border-radius:6px;background:var(--amber-soft);font-size:12px;color:#74511c}.split-switch{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:6px;background:#f7f8fa}.split-button{height:30px;padding:0 13px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:11px;font-weight:650}.split-button.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}.evidence-badge{display:inline-flex;padding:4px 8px;border-radius:4px;background:var(--amber-soft);color:var(--amber);font-size:11px;font-weight:700}.evidence-badge.good{background:var(--green-soft);color:var(--green)}.audit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.audit-cell{padding:15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.audit-cell strong{display:block;font-family:var(--mono);font-size:18px}.audit-cell span{font-size:11px;color:var(--muted)}.dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dist-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}.dist-row{display:flex;justify-content:space-between;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12px}.dist-row:last-child{border-bottom:0}.status-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.status-item{border:1px solid var(--line);border-radius:6px;padding:12px}.status-item b{display:block;font-size:12px}.status-item span{display:block;color:var(--muted);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.consensus-table .agreed_true{color:var(--green);font-weight:700}.consensus-table .agreed_false{color:var(--muted)}.consensus-table .disputed,.consensus-table .invalid{color:var(--red);font-weight:700}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:11px;text-align:center}
  @media(max-width:900px){.workspace{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.trace{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.formula{grid-template-columns:1fr 1fr}.ai-grid{grid-template-columns:1fr 1fr}.status-list{grid-template-columns:1fr 1fr}.audit-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.topbar{padding:0 14px}.positioning{display:none}.status{max-width:210px;text-align:right}main{padding:14px 12px 40px}.view-tabs{display:flex;width:100%}.view-tab{flex:1;padding:0 6px}.input-panel{padding:15px}.meta-grid{grid-template-columns:1fr}.url-row{grid-template-columns:1fr}.primary{width:100%}.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:last-child{grid-column:span 2}.trace{grid-template-columns:1fr}.formula{grid-template-columns:1fr 1fr}.ai-grid{grid-template-columns:1fr}.bar{grid-template-columns:88px 66px minmax(52px,1fr) 58px;gap:7px}.section-body{padding:13px}.section-head{padding:13px}.chart{height:280px}.history-title{align-items:start;flex-direction:column;gap:3px}.dist-grid{grid-template-columns:1fr}.status-list{grid-template-columns:1fr}.audit-grid{grid-template-columns:1fr 1fr}.config-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div><div class="brand">Alpha<span>Lens</span></div><div class="positioning">金融文本另类因子研究台</div></div>
    <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">本地研究服务连接中 · DeepSeek 待凭证 · 规则库版本 R1</span></div>
  </header>
  <main>
    <div class="view-tabs" role="tablist" aria-label="研究视图">
      <button class="view-tab active" id="liveTab" role="tab" aria-selected="true" data-view="liveView">新文本分析</button>
      <button class="view-tab" id="historyTab" role="tab" aria-selected="false" data-view="historyView">历史研究</button>
      <button class="view-tab" id="auditTab" role="tab" aria-selected="false" data-view="auditView">研究审计</button>
    </div>
    <section class="view active" id="liveView" role="tabpanel" aria-labelledby="liveTab">
    <div class="workspace">
      <section class="panel input-panel">
        <h1 class="panel-title">新文本分析</h1>
        <div class="field"><label class="label" for="title">标题</label><input id="title" type="text" placeholder="文本标题"></div>
        <div class="field"><label class="label" for="content">正文</label><textarea id="content" placeholder="粘贴政策、公告、财经新闻或互动问答正文"></textarea></div>
        <div class="meta-grid">
          <div class="field"><label class="label" for="sourceType">来源类型</label><select id="sourceType"><option value="policy">政策</option><option value="announcement">公告</option><option value="news">新闻</option><option value="ir_qa">互动问答</option><option value="auto">自动识别</option></select></div>
          <div class="field"><label class="label" for="sourceName">来源名称</label><input id="sourceName" type="text" placeholder="例如：国家能源局"></div>
          <div class="field"><label class="label" for="eventDate">首次公开日期</label><input id="eventDate" type="date"></div>
          <div class="field"><label class="label" for="sourceUrl">正文链接</label><input id="sourceUrl" type="url" placeholder="https://..."></div>
        </div>
        <span class="label">示例文本</span><div class="examples"><button class="example" data-example="0">储能政策</button><button class="example" data-example="1">锂电公告</button><button class="example" data-example="2">光伏新闻</button></div>
      </section>
      <aside class="panel side">
        <h2 class="panel-title">运行配置</h2>
        <div class="config-block"><span class="label">运行入口</span><div class="mode-switch"><button class="mode-button active" data-run-mode="live">实时 AI 分析</button><button class="mode-button" data-run-mode="replay">冻结回放</button></div></div>
        <div class="field"><label class="label" for="analysisMode">分析模式</label><select id="analysisMode"><option value="hybrid">大模型候选 + 规则校验</option></select></div>
        <div class="field" id="apiKeyField"><label class="label" for="apiKey">DeepSeek API Key（仅本次请求）</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="sk-..."></div>
        <div class="config-actions"><button class="secondary" id="checkApiButton">检查连接</button><button class="primary" id="runButton">开始分析</button></div>
        <div class="connection" id="connectionStatus">DeepSeek 待凭证</div>
        <div class="run-state" id="runState"><span class="spinner"></span><span>正在运行分析链路</span></div>
        <div class="config-block" style="margin-top:16px"><div class="runtime-meta"><div><span>当前模型</span><b id="modelName">DeepSeek V4 Flash</b></div><div><span>冻结规则</span><b id="ruleVersion">R1</b></div><div><span>Prompt</span><b id="promptVersion">--</b></div><div><span>Git</span><b id="version">--</b></div></div></div>
        <div class="limit" id="modeLimit">实时模式必须成功调用 AI；无 Key 或调用失败时不会生成结果。</div>
        <div class="disclaimer">本报告仅供研究参考，不构成投资建议</div>
      </aside>
    </div>
    <div id="result"></div>
    </section>
    <section class="view" id="historyView" role="tabpanel" aria-labelledby="historyTab">
      <div id="historyContent"><div class="panel empty">正在读取历史研究输出</div></div>
    </section>
    <section class="view" id="auditView" role="tabpanel" aria-labelledby="auditTab">
      <div id="auditContent"><div class="panel empty">正在读取研究审计记录</div></div>
    </section>
  </main>
  <footer>AlphaLens 是量化研究助手，不预测股票价格，不提供投资建议。</footer>
</div>
<script>
const EXAMPLES = [
  {title:'关于印发《新型储能规模化建设专项行动方案（2025—2027年）》的通知',content:'原文摘要：为推动新型储能高质量发展，国家发展改革委、国家能源局研究制定了《新型储能规模化建设专项行动方案（2025—2027年）》。现予印发，请结合实际认真抓好贯彻落实。',type:'policy',name:'中国政府网',date:'2025-08-27',url:'https://www.gov.cn/zhengce/zhengceku/202509/content_7040296.htm'},
  {title:'上海璞泰来新能源科技集团股份有限公司关于投资建设年产72亿平方米锂离子电池隔膜建设项目的公告',content:'原文摘要：璞泰来披露年产72亿平方米锂离子电池隔膜建设项目，计划总投资56亿元人民币。重要内容提示：交易实施尚需履行审批及其他相关程序。',type:'announcement',name:'巨潮资讯网',date:'2026-05-21',url:'http://static.cninfo.com.cn/finalpage/2026-05-21/1225319446.PDF'},
  {title:'315GW+119GW！2025年光伏、风电年新增装机再创新高',content:'原文摘要：国家能源局发布2025年全国电力统计数据，光伏、风电年新增装机量分别达到315GW和119GW。截至2025年底，全国累计发电装机容量38.9亿千瓦，同比增长16.1%；太阳能发电装机容量12.0亿千瓦，同比增长35.4%，风电装机容量6.4亿千瓦，同比增长22.9%。',type:'news',name:'腾讯新闻',date:'2026-01-28',url:'https://news.qq.com/rain/a/20260128A043VK00'}
];
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const pct = value => Number.isFinite(Number(value)) ? `${Number(value)>=0?'+':''}${(Number(value)*100).toFixed(2)}%` : '--';
const fixed = (value, digits=4) => Number.isFinite(Number(value)) ? Number(value).toFixed(digits) : '--';
let historyData = null;
let auditData = null;
let currentAnalysis = null;
let runMode = 'live';
let historySplit = 'oos';

document.querySelectorAll('[data-example]').forEach(button => button.addEventListener('click', () => loadExample(Number(button.dataset.example))));
document.querySelectorAll('.view-tab').forEach(button => button.addEventListener('click', () => switchView(button.dataset.view)));
document.querySelectorAll('[data-run-mode]').forEach(button => button.addEventListener('click', () => setRunMode(button.dataset.runMode)));
$('runButton').addEventListener('click', analyze);
$('checkApiButton').addEventListener('click', checkApi);
$('eventDate').value = new Date().toISOString().slice(0,10);

function switchView(viewId){
  document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.id === viewId));
  document.querySelectorAll('.view-tab').forEach(tab => {const active=tab.dataset.view===viewId;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active));});

async function analyze(){

  const dist=(rows,labels={})=>`<div class="dist-list">${Object.entries(rows).map(([name,value])=>`<div class="dist-row"><span>${esc(labels[name]||name)}</span><b>${esc(value)}</b></div>`).join('')}</div>`;
  const diagnostics=audit.rule_diagnostics||[];
  let html=`<div class="section-body"><div class="history-title"><div><h1>研究审计</h1><p>数据覆盖、模型版本、规则支持和时间边界集中披露</p></div><span class="history-date">git ${esc(audit.model.repository_commit)}</span></div><div class="audit-grid">${Object.entries(countLabels).map(([key,label])=>`<div class="audit-cell"><strong>${esc(audit.counts[key])}</strong><span>${label}</span></div>`).join('')}</div></div>`;
  html+=`<section class="section" style="border-left:0;border-right:0;border-radius:0"><div class="section-head"><h2>来源与事件分布</h2><span class="scope">仅在审计页展示库存数量</span></div><div class="section-body"><div class="dist-grid"><div><span class="label">来源类型</span>${dist(audit.source_type_counts,sourceLabels)}</div><div><span class="label">事件类型</span>${dist(audit.event_type_counts)}</div></div></div></section>`;
  html+=`<section class="section" style="border-left:0;border-right:0;border-radius:0"><div class="section-head"><h2>数据与版本状态</h2><span class="scope">可复现性记录</span></div><div class="section-body"><div class="status-list"><div class="status-item"><b>URL 自动核验</b><span>${audit.source_verification.automated_pass_count} 条通过 · ${audit.source_verification.unique_url_count} 个唯一链接</span></div><div class="status-item"><b>事件人工抽检</b><span>${audit.event_review.reviewed_count} 条 · ${esc(audit.event_review.status)}</span></div><div class="status-item"><b>谓词人工抽检</b><span>${audit.predicate_review.reviewed_count} 条 · ${esc(audit.predicate_review.status)}</span></div><div class="status-item"><b>来源人工状态</b><span>${esc(audit.source_verification.status)}</span></div><div class="status-item"><b>行情覆盖</b><span>${esc(audit.market.start)} 至 ${esc(audit.market.end)}</span></div><div class="status-item"><b>复权限制</b><span>${audit.market.adj_factor_placeholder?'adj_factor=1 为占位字段':'复权因子已导入'}</span></div><div class="status-item"><b>大模型 / 规则</b><span>${esc(audit.model.chat_model)} · ${esc(audit.model.prompt_version)} · ${esc(audit.model.rule_version)}</span></div><div class="status-item"><b>未来函数审计</b><span class="${audit.future_info_audit==='pass'?'good':'warn'}">${esc(audit.future_info_audit)} · event_time 早于收益入场日</span></div></div><div class="limit">adj_factor=1 尚不是真实复权因子序列；当前 OOS 有效日期少，不宣称因子稳定有效。</div></div></section>`;
  html+=`<section class="section" style="border:0;border-radius:0"><div class="section-head"><h2>规则独立支持诊断</h2><span class="scope">行业政策映射多只股票仍只计 1 份文档</span></div><div class="section-body"><div class="table-wrap"><table><thead><tr><th>规则</th><th>独立文档</th><th>独立日期</th><th>股票覆盖</th><th>Discovery 超额收益</th><th>OOS 文档</th><th>OOS 超额收益</th><th>状态</th></tr></thead><tbody>${diagnostics.map(row=>`<tr><td class="mono">${esc(row.rule_id)}</td><td>${esc(row.independent_document_count)}</td><td>${esc(row.independent_date_count)}</td><td>${esc(row.stock_count)}</td><td>${pct(row.discovery_avg_excess_return_5d)}</td><td>${esc(row.oos_document_count)}</td><td>${pct(row.oos_avg_excess_return_5d)}</td><td>${esc(row.status)}</td></tr>`).join('')}</tbody></table></div></div></section>`;
  $('auditContent').innerHTML=html;
}

function downloadReport(text){const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`AlphaLens_研究记录_${new Date().toISOString().slice(0,10)}.md`;link.click();URL.revokeObjectURL(url);}
function markdown(text){return esc(text).replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^\|(.+)\|$/gm,(line)=>`<tr>${line.split('|').slice(1,-1).map(cell=>/^\s*:?-+:?\s*$/.test(cell)?'':`<td>${cell.trim()}</td>`).join('')}</tr>`).replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g,rows=>`<div class="table-wrap"><table>${rows}</table></div>`).replace(/^- (.+)$/gm,'<div>• $1</div>').replace(/\n\n/g,'<br>');}
loadStatus();loadHistory();loadAudit();
</script>
