<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens — 金融文本因子挖掘与量化回测</title>
<script src="https://cdn.plot.ly/plotly-3.0.0.min.js"></script>
<style>
  :root {
    --bg: #faf9f6; --card: #ffffff; --bor: #e5e0d8;
    --tx: #1a1a1a; --mu: #6b6560; --ac: #2563eb;
    --gr: #059669; --rd: #dc2626; --am: #d97706;
    --ff: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --fm: 'JetBrains Mono', 'SF Mono', monospace;
    --sh: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { font-family:var(--ff); background:var(--bg); color:var(--tx); line-height:1.6; -webkit-font-smoothing:antialiased }
  .app { max-width:1100px; margin:0 auto; padding:40px 24px 80px }

  /* header */
  .top { text-align:center; margin-bottom:32px }
  .top h1 { font-size:2rem; font-weight:700; letter-spacing:-.02em }
  .top h1 span { color:var(--ac); font-weight:400 }
  .top .sub { color:var(--mu); font-size:.9rem; margin-top:4px }

  /* input card */
  .inp-card { background:var(--card); border:1px solid var(--bor); border-radius:12px; padding:28px; margin-bottom:28px; box-shadow:var(--sh) }
  .inp-card textarea { width:100%; padding:16px; border:1px solid var(--bor); border-radius:8px; font-size:.9rem; font-family:var(--ff); line-height:1.7; resize:vertical; min-height:160px; outline:none; transition:border-color .2s; background:var(--bg) }
  .inp-card textarea:focus { border-color:var(--ac); box-shadow:0 0 0 3px rgba(37,99,235,.1) }
  .inp-card textarea::placeholder { color:#b8b3ad }
  .inp-row { display:flex; gap:12px; margin-top:14px; align-items:center; flex-wrap:wrap }
  .inp-row input { flex:1; min-width:200px; padding:9px 14px; border:1px solid var(--bor); border-radius:6px; font-size:.84rem; font-family:var(--ff); outline:none; background:var(--bg) }
  .inp-row input:focus { border-color:var(--ac) }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 28px; border-radius:8px; font-size:.88rem; font-weight:600; cursor:pointer; border:none; transition:all .15s; letter-spacing:.01em }
  .btn-go { background:var(--ac); color:#fff }
  .btn-go:hover { background:#1d4ed8; box-shadow:0 2px 8px rgba(37,99,235,.25) }
  .btn-go:disabled { opacity:.5; cursor:not-allowed; box-shadow:none }
  .btn-gh { background:transparent; border:1px solid var(--bor); color:var(--mu); padding:7px 16px; font-size:.8rem; font-weight:500 }
  .btn-gh:hover { border-color:var(--ac); color:var(--ac) }
  .hint { font-size:.78rem; color:var(--mu); margin-top:8px }

  /* results */
  .res { display:none }
  .res.on { display:block; animation:fi .3s ease }
  @keyframes fi { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .err-card { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:20px 24px; text-align:center; color:var(--rd) }

  /* kpi */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px }
  .kpi { background:var(--card); border:1px solid var(--bor); border-radius:10px; padding:20px; box-shadow:var(--sh) }
  .kpi .kv { font-family:var(--fm); font-size:1.4rem; font-weight:600; color:var(--tx) }
  .kpi .kl { font-size:.72rem; color:var(--mu); margin-top:2px }

  /* panels */
  .sec { background:var(--card); border:1px solid var(--bor); border-radius:12px; padding:28px; margin-bottom:20px; box-shadow:var(--sh) }
  .sec h2 { font-size:1rem; font-weight:700; margin-bottom:18px; color:var(--tx); display:flex; align-items:center; gap:8px }
  .sec h2 .dot { width:8px; height:8px; border-radius:50%; background:var(--ac); flex-shrink:0 }
  .sec h3 { font-size:.88rem; font-weight:600; margin:20px 0 10px; color:var(--mu) }

  /* table */
  .tbl { width:100%; border-collapse:collapse; font-family:var(--fm); font-size:.78rem }
  .tbl th { padding:9px 14px; text-align:left; border-bottom:2px solid var(--bor); color:var(--mu); font-weight:600; font-size:.7rem; letter-spacing:.03em }
  .tbl td { padding:8px 14px; border-bottom:1px solid var(--bor); font-variant-numeric:tabular-nums }
  .up { color:var(--gr); font-weight:600 } .dn { color:var(--rd); font-weight:600 }

  /* bar */
  .bar { display:flex; align-items:center; gap:10px; margin:5px 0; font-family:var(--fm); font-size:.76rem }
  .bar .bn { width:90px; text-align:right; flex-shrink:0; overflow:hidden; text-overflow:ellipsis }
  .bar .bs { width:48px; font-size:.66rem; color:var(--mu); text-align:right; flex-shrink:0 }
  .bar .bt { flex:1; height:24px; background:var(--bg); border-radius:6px; overflow:hidden }
  .bar .bf { height:100%; border-radius:6px; background:linear-gradient(90deg, #93c5fd, var(--ac)); transition:width .5s }
  .bar .bv { width:56px; font-weight:600; flex-shrink:0 }

  /* report */
  .report { font-size:.86rem; line-height:1.9; color:#333 }
  .report h2 { font-size:1.1rem; margin:28px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--bor) }
  .report h3 { font-size:.92rem; margin:16px 0 8px }
  .report ul, .report ol { margin:8px 0 8px 20px }
  .report li { margin:3px 0 }
  .report code { background:#f1f0ed; padding:2px 6px; border-radius:3px; font-size:.8rem }
  .report pre { background:#f1f0ed; padding:14px 18px; border-radius:8px; overflow-x:auto; font-size:.8rem; line-height:1.5; margin:10px 0 }
  .report blockquote { border-left:3px solid var(--ac); padding:6px 16px; margin:10px 0; color:var(--mu); background:#f8fafc }
  .report table { width:100%; border-collapse:collapse; margin:10px 0; font-size:.8rem }
  .report th, .report td { padding:7px 12px; border:1px solid var(--bor); text-align:left }
  .report th { background:#f8fafc; font-weight:600 }

  .chart { width:100%; min-height:380px; margin:12px 0 }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite }
  @keyframes spin { to{transform:rotate(360deg)} }

  @media (max-width:600px) {
    .app { padding:20px 12px 40px }
    .inp-card { padding:16px }
    .top h1 { font-size:1.5rem }
  }
</style>
</head>
<body>
<div class="app">
<header class="top">
  <h1>Alpha<span>Lens</span></h1>
  <p class="sub">金融文本因子挖掘与量化回测系统</p>
</header>

<!-- INPUT -->
<div class="inp-card">
  <textarea id="content" placeholder="粘贴金融文本（政策、公告、财经新闻或互动问答），系统将自动识别事件类型、关联股票、触发规则并完成回测验证……"></textarea>
  <div class="inp-row">
    <input type="text" id="title" placeholder="标题（可选，留空则自动提取）">
    <button class="btn btn-go" onclick="analyze()" id="rb">&#9654; 开始分析</button>
  </div>
  <div class="hint">
    快捷示例：
    <button class="btn-gh" onclick="loadEx(0)">储能政策</button>
    <button class="btn-gh" onclick="loadEx(1)">锂电产能</button>
    <button class="btn-gh" onclick="loadEx(2)">光伏新闻</button>
  </div>
</div>

<!-- RESULTS -->
<div class="res" id="res"></div>

<footer style="text-align:center;color:var(--mu);font-size:.76rem;margin-top:40px">
  AlphaLens &middot; 仅供研究参考，不构成投资建议
</footer>
</div>

<script>
const EX = [
  {t:"新型储能参与电力系统调节能力建设方案",c:"国家发展改革委、国家能源局发布新型储能发展实施方案，强调独立储能、源网荷储协同和新能源消纳，重点支持储能系统集成、逆变器和数据中心电源等方向的技术创新和规模化应用。政策的落地预计将推动派能科技、固德威、锦浪科技等储能企业的订单增长，科华数据的数据中心电源业务也将受益于新型储能应用场景的扩围。"},
  {t:"宁德时代披露动力电池与储能业务产能规划进展",c:"公司公告显示，宁德时代继续围绕动力电池、储能电池和新技术产品推进产能与客户交付能力建设。公司将新增20GWh动力电池产能，预计2025年Q3投产。公告同时提示项目建设、客户需求和原材料价格存在不确定性。"},
  {t:"光伏产业链价格出现阶段性企稳迹象",c:"财经新闻摘要称，硅料、硅片和组件价格经历调整后出现阶段性企稳迹象，市场关注产能出清和需求修复节奏。隆基绿能、通威股份、TCL中环等头部企业的产能利用率和海外订单情况受到机构关注。光伏装机需求持续增长，行业供需格局有望改善。"}
];

function loadEx(i) {
  const e = EX[i];
  document.getElementById('title').value = e.t;
  document.getElementById('content').value = e.c;
}

async function analyze() {
  const btn = document.getElementById('rb');
  const content = document.getElementById('content').value.trim();
  if (!content) { showError('请粘贴金融文本内容'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 分析中...';
  document.getElementById('res').classList.remove('on');

  try {
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: document.getElementById('title').value.trim(),
        content: content,
        source_type: 'auto',
        source_name: '自动识别',
        event_date: new Date().toISOString().split('T')[0]
      })
    });
    const data = await resp.json();
    if (data.error) { showError(data.error, data.entities); btn.disabled = false; btn.innerHTML = '&#9654; 开始分析'; return; }
    render(data);
  } catch (e) {
    showError('分析服务异常：' + e.message + '。请确认后端服务已启动（python3 app/server.py）');
  }
  btn.disabled = false;
  btn.innerHTML = '&#9654; 开始分析';
}

function showError(msg, entities) {
  const el = document.getElementById('res');
  el.classList.add('on');
  let h = '<div class="err-card"><b>分析未能完成</b><br><span style="font-size:.84rem">' + msg + '</span>';
  if (entities && entities.length) {
    h += '<div style="margin-top:10px;font-size:.82rem;color:var(--mu)">识别到关联实体：' + entities.map(e => e.name).join('、') + '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
}

function render(d) {
  const el = document.getElementById('res');
  el.classList.add('on');

  const bt = d.backtest || {};
  const stocks = d.stock_results || [];
  const topStock = stocks[0];

  let h = '';

  // ── KPI Row ──
  h += '<div class="kpis">';
  h += kpi(d.event_type, '检测事件');
  h += kpi(stocks.length, '关联股票');
  h += kpi((d.triggered_rules||[]).length, '触发规则');
  h += kpi(formatPct(bt.avg_rank_ic), '平均 Rank IC');
  h += kpi(formatNum(bt.icir), 'ICIR');
  h += kpi(formatPct(bt.positive_return_rate), '正收益比例');
  h += '</div>';

  // ── Factor Ranking ──
  h += '<div class="sec"><h2><span class="dot"></span>因子排名</h2>';
  const maxF = Math.max(...stocks.map(s => Math.abs(s.factor)), 0.001);
  for (const s of stocks) {
    const w = Math.abs(s.factor) / maxF * 100;
    h += '<div class="bar"><span class="bn">' + s.name + '</span><span class="bs">' + s.sector + '</span><div class="bt"><div class="bf" style="width:' + w + '%"></div></div><span class="bv">' + s.factor.toFixed(2) + '</span></div>';
  }
  h += '</div>';

  // ── Backtest Dashboard ──
  h += '<div class="sec"><h2><span class="dot"></span>回测验证</h2>';

  // Metrics table
  h += '<table class="tbl"><tr><th>指标</th><th>数值</th><th>说明</th></tr>';
  h += btRow('因子样本数', bt.factor_sample_count || 0, '触发事件且可计算前向收益的样本');
  h += btRow('平均 Rank IC (5日)', formatPct(bt.avg_rank_ic), '因子预测收益与实际收益的秩相关性');
  h += btRow('ICIR', formatNum(bt.icir), 'Rank IC / IC 标准差，衡量因子稳定性');
  h += btRow('G5-G1 收益差', formatPct(bt.g5_g1_spread), '因子最高组减最低组的收益差');
  h += btRow('年化收益', formatPct(bt.annualized_return), '多空组合年化收益率');
  h += btRow('Sharpe Ratio', formatNum(bt.sharpe_ratio), '风险调整后收益');
  h += btRow('最大回撤', formatPct(bt.max_drawdown), '多空组合最大回撤');
  h += btRow('正收益比例 (5日)', formatPct(bt.positive_return_rate), '事件样本中5日收益为正的比例');
  h += btRow('未来函数审计', bt.future_function_audit === 'pass' ? '<span style="color:var(--gr);font-weight:600">通过</span>' : '<span style="color:var(--rd)">' + (bt.future_function_audit || 'pending') + '</span>', '所有收益入场日严格晚于 event_time');
  h += '</table>';

  // Factor decay
  const decay = bt.factor_decay || {};
  if (Object.keys(decay).length) {
    h += '<h3>因子衰减分析</h3>';
    h += '<table class="tbl"><tr><th>持有期</th><th>样本数</th><th>平均收益</th><th>胜率</th></tr>';
    for (const [label, d] of Object.entries(decay)) {
      h += '<tr><td>' + label + '</td><td>' + d.count + '</td><td class="' + (d.avg_return > 0 ? 'up' : 'dn') + '">' + formatPct(d.avg_return) + '</td><td>' + formatPct(d.win_rate) + '</td></tr>';
    }
    h += '</table>';
  }

  // Train/test split
  h += '<h3>训练/测试期对比</h3>';
  h += '<table class="tbl"><tr><th>周期</th><th>事件数</th><th>平均 Rank IC</th></tr>';
  h += '<tr><td>训练期 (2024-2025)</td><td>' + (bt.train_period?.event_count || 0) + '</td><td>' + formatPct(bt.train_period?.avg_rank_ic || 0) + '</td></tr>';
  h += '<tr><td>测试期 (2026)</td><td>' + (bt.test_period?.event_count || 0) + '</td><td>' + formatPct(bt.test_period?.avg_rank_ic || 0) + '</td></tr>';
  h += '</table>';

  h += '<p style="font-size:.78rem;color:var(--mu);margin-top:12px">' + (bt.trading_cost_note || '') + '</p>';
  h += '<p style="font-size:.78rem;color:var(--mu)">' + (bt.turnover_note || '') + '</p>';
  h += '</div>';

  // ── Charts ──
  h += '<div class="sec"><h2><span class="dot"></span>可视化</h2>';
  h += '<div class="chart" id="chart-ic"></div>';
  h += '<div class="chart" id="chart-groups"></div>';
  h += '<div class="chart" id="chart-ls"></div>';
  h += '</div>';

  // ── Research Report ──
  if (d.report) {
    h += '<div class="sec"><h2><span class="dot"></span>自动研究报告</h2>';
    h += '<div class="report">' + md2html(d.report) + '</div></div>';
  }

  // ── Event & Rules detail ──
  if (topStock && topStock.predicates) {
    h += '<div class="sec"><h2><span class="dot"></span>事件与规则详情</h2>';
    h += '<p style="font-size:.84rem;color:var(--mu);margin-bottom:12px">检测事件：<b style="color:var(--tx)">' + d.event_type + '</b>，证据强度：<b style="color:var(--tx)">' + (d.evidence_strength * 100).toFixed(0) + '%</b></p>';
    // Predicates
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
    for (const p of topStock.predicates) {
      const v = typeof p.value === 'boolean' ? (p.value ? 'true' : 'false') : p.value;
      const cls = p.value === true ? 'style="background:#ecfdf5;border:1px solid #a7f3d0;color:#059669"' : typeof p.value !== 'boolean' ? 'style="background:#fffbeb;border:1px solid #fde68a;color:#d97706"' : 'style="background:#f9fafb;border:1px solid #e5e7eb;color:#9ca3af"';
      h += '<span ' + cls + ' title="' + p.rationale + '" style="display:inline-block;padding:4px 10px;border-radius:4px;font-family:var(--fm);font-size:.68rem">' + p.name + ' = ' + v + '</span>';
    }
    h += '</div>';
    // Rules
    if (d.triggered_rules && d.triggered_rules.length) {
      h += '<table class="tbl"><tr><th>规则</th><th>条件</th><th>历史样本</th><th>胜率</th><th>平均收益</th><th>评分</th></tr>';
      for (const r of d.triggered_rules) {
        h += '<tr><td style="color:var(--ac);font-weight:600">' + r.id + '</td><td style="font-size:.7rem">' + r.cond + '</td><td>' + (r.support || 0) + '</td><td class="' + (r.win_rate > 0.5 ? 'up' : 'dn') + '">' + formatPct(r.win_rate) + '</td><td class="' + (r.avg_return > 0 ? 'up' : 'dn') + '">' + formatPct(r.avg_return) + '</td><td>' + (r.score || 0).toFixed(2) + '</td></tr>';
      }
      h += '</table>';
    }
    h += '</div>';
  }

  el.innerHTML = h;

  // Render charts
  setTimeout(() => renderCharts(d), 200);
}

function renderCharts(d) {
  const bt = d.backtest || {};
  const stocks = d.stock_results || [];

  // Rank IC time series
  const icData = bt.ic_timeseries || [];
  if (icData.length > 1) {
    Plotly.newPlot('chart-ic', [{
      x: Array.from({length: icData.length}, (_, i) => i + 1),
      y: icData,
      type: 'bar',
      marker: { color: icData.map(v => v >= 0 ? '#059669' : '#dc2626') },
      name: 'Rank IC'
    }], {
      title: 'Rank IC 时间序列',
      xaxis: { title: '事件序号' },
      yaxis: { title: 'Rank IC', zeroline: true, zerolinecolor: '#e5e0d8' },
      margin: { l: 60, r: 20, t: 40, b: 50 },
      paper_bgcolor: '#fff', plot_bgcolor: '#faf9f6'
    }, { responsive: true });
  }

  // Group returns
  const groups = bt.group_returns || [];
  if (groups.length) {
    Plotly.newPlot('chart-groups', [{
      x: groups.map(g => g.group),
      y: groups.map(g => g.avg_return_5d),
      type: 'bar',
      marker: { color: groups.map((_, i) => i === 0 ? '#dc2626' : i === 4 ? '#059669' : '#93c5fd') },
      text: groups.map(g => (g.avg_return_5d * 100).toFixed(2) + '%'),
      textposition: 'outside',
      name: '平均收益'
    }], {
      title: '分组收益 (G1-G5)',
      yaxis: { title: '5日前向收益', tickformat: '.1%' },
      margin: { l: 60, r: 20, t: 40, b: 50 },
      paper_bgcolor: '#fff', plot_bgcolor: '#faf9f6'
    }, { responsive: true });
  }

  // Long-short cumulative
  const lsData = bt.long_short_cumulative || [];
  if (lsData.length > 1) {
    Plotly.newPlot('chart-ls', [{
      x: Array.from({length: lsData.length}, (_, i) => i + 1),
      y: lsData,
      type: 'scatter',
      mode: 'lines',
      fill: 'tozeroy',
      line: { color: '#2563eb', width: 2 },
      name: '累计收益'
    }], {
      title: '多空组合累计收益',
      yaxis: { title: '累计收益', tickformat: '.1%' },
      margin: { l: 60, r: 20, t: 40, b: 50 },
      paper_bgcolor: '#fff', plot_bgcolor: '#faf9f6'
    }, { responsive: true });
  }
}

// Helpers
function kpi(v, l) { return '<div class="kpi"><div class="kv">' + v + '</div><div class="kl">' + l + '</div></div>'; }
function btRow(label, val, desc) { return '<tr><td>' + label + '</td><td style="font-weight:600">' + val + '</td><td style="font-size:.74rem;color:var(--mu)">' + desc + '</td></tr>'; }
function formatPct(v) { const n = Number(v); return isNaN(n) ? '--' : (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + '%'; }
function formatNum(v) { const n = Number(v); return isNaN(n) ? '--' : n.toFixed(2); }

function md2html(md) {
  return md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\|(.+)\|/g, (m) => {
      const cells = m.split('|').filter(c => c.trim());
      return '<tr>' + cells.map(c => {
        const trimmed = c.trim();
        return /^[-:]+$/.test(trimmed) ? '' : '<td>' + trimmed + '</td>';
      }).join('') + '</tr>';
    })
    .replace(/\n\n/g, '<br><br>');
}
</script>
