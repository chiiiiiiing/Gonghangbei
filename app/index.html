<title>AlphaLens — 金融文本因子挖掘与回测</title>

<style>
  :root {
    --bg: #0c0e12; --surface: #13161b; --raised: #1a1e24;
    --border: #252830; --text: #ddd8ce; --muted: #787366;
    --amber: #c8882e; --amber-bg: rgba(200,136,46,.10);
    --green: #2d9956; --green-bg: rgba(45,153,86,.10);
    --red: #c94040; --red-bg: rgba(201,64,64,.08);
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { font-family:var(--font-body); background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh }
  .app { max-width:1200px; margin:0 auto; padding:28px 24px 60px }

  /* header */
  .topbar { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:10px }
  .topbar h1 { font-size:1.5rem; font-weight:700; letter-spacing:-.01em }
  .topbar h1 span { color:var(--amber); font-weight:400 }
  .topbar .tagline { font-family:var(--font-mono); font-size:.68rem; color:var(--muted); letter-spacing:.03em }

  /* input card */
  .input-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:24px; margin-bottom:20px }
  .input-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 20px }
  @media (max-width:700px) { .input-grid { grid-template-columns:1fr } }
  .field { margin-bottom:14px }
  .field.full { grid-column:1/-1 }
  label { display:block; font-family:var(--font-mono); font-size:.66rem; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-bottom:4px }
  input, select, textarea { width:100%; padding:9px 12px; background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--text); font-size:.84rem; font-family:var(--font-body); outline:none; transition:border-color .15s }
  input:focus, select:focus, textarea:focus { border-color:var(--amber) }
  textarea { resize:vertical; min-height:120px; line-height:1.6 }
  .btn-row { display:flex; gap:8px; margin-top:4px; flex-wrap:wrap }
  .btn { font-family:var(--font-mono); font-size:.74rem; font-weight:500; padding:10px 22px; border-radius:5px; cursor:pointer; border:none; letter-spacing:.02em; transition:all .15s; display:inline-flex; align-items:center; gap:6px }
  .btn-primary { background:var(--amber); color:#0c0e12; font-weight:600 }
  .btn-primary:hover { background:#d4993c }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 14px; font-size:.7rem }
  .btn-ghost:hover { color:var(--text); border-color:var(--muted) }

  /* results */
  .results { display:none }
  .results.active { display:block; animation:fadeIn .3s ease }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* metrics row */
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:18px 20px }
  .kpi .kpi-val { font-family:var(--font-mono); font-size:1.5rem; font-weight:600 }
  .kpi .kpi-lbl { font-family:var(--font-mono); font-size:.62rem; color:var(--muted); letter-spacing:.04em; margin-top:4px }
  .kpi .kpi-sub { font-family:var(--font-mono); font-size:.66rem; color:var(--muted); margin-top:2px }

  /* panels */
  .section { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:22px; margin-bottom:16px }
  .section h2 { font-size:.88rem; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px }
  .section h2 .badge { font-family:var(--font-mono); font-size:.6rem; padding:2px 8px; border-radius:3px; font-weight:500 }
  .badge.amber { background:var(--amber-bg); color:var(--amber) }
  .badge.green { background:var(--green-bg); color:var(--green) }

  /* table */
  .tbl { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:.72rem }
  .tbl th { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); color:var(--muted); font-weight:500; font-size:.64rem; letter-spacing:.04em }
  .tbl td { padding:7px 12px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums }
  .tbl .up { color:var(--green) }
  .tbl .dn { color:var(--red) }
  .tbl .hl { color:var(--amber); font-weight:600 }

  /* factor bar */
  .fbar { display:flex; align-items:center; gap:10px; margin:5px 0; font-family:var(--font-mono); font-size:.72rem }
  .fbar .fn { width:74px; text-align:right; flex-shrink:0; overflow:hidden; text-overflow:ellipsis }
  .fbar .fs { width:42px; font-size:.64rem; color:var(--muted); text-align:right; flex-shrink:0 }
  .fbar .ft { flex:1; height:22px; background:var(--bg); border-radius:4px; overflow:hidden }
  .fbar .ff { height:100%; border-radius:4px; background:linear-gradient(90deg,transparent,var(--amber)); transition:width .5s }
  .fbar .fv { width:56px; font-weight:500; flex-shrink:0 }
  .fbar .fr { width:72px; font-size:.64rem; color:var(--muted); flex-shrink:0 }

  /* bar chart */
  .hbar { display:flex; align-items:center; gap:10px; margin:4px 0 }
  .hbar .hlbl { width:90px; font-family:var(--font-mono); font-size:.68rem; text-align:right; color:var(--muted); flex-shrink:0 }
  .hbar .htrk { flex:1; height:26px; background:var(--bg); border-radius:4px; overflow:hidden }
  .hbar .hfl { height:100%; border-radius:4px; transition:width .5s }
  .hbar .hvl { width:64px; font-family:var(--font-mono); font-size:.7rem; font-weight:500; flex-shrink:0 }

  /* spark */
  .spark { display:flex; align-items:flex-end; gap:2px; height:50px }
  .spark .sp { flex:1; min-width:2px; border-radius:1px 1px 0 0 }
  .spark-lbl { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.6rem; color:var(--muted); margin-top:6px }

  /* event chips */
  .evt-tag { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:.7rem; padding:4px 10px; border-radius:4px; background:var(--amber-bg); color:var(--amber); margin-bottom:8px; font-weight:500 }

  /* predicates grid */
  .pred-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; margin-top:6px }
  .pred-item { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:var(--raised); border-radius:5px; font-size:.74rem }
  .pred-item .pv { font-family:var(--font-mono); font-size:.68rem; font-weight:500 }
  .pred-item .pt { color:var(--green) }
  .pred-item .pf { color:var(--muted) }

  /* footer */
  .footer { text-align:center; font-family:var(--font-mono); font-size:.62rem; color:var(--muted); margin-top:32px; padding-top:16px; border-top:1px solid var(--border); letter-spacing:.02em }

  .empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:.84rem }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--border); border-top-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>

  const text=title+'\n'+content, seen=new Set(), res=[];
  for(const r of ALIAS_TBL){if(!text.includes(r.al)||seen.has(r.c))continue;seen.add(r.c);const cf=r.n===r.al&&title.includes(r.n)?0.98:title.includes(r.al)?0.95:content.includes(r.n)?0.91:0.84;res.push({code:r.c,name:r.n,sector:r.sec,conf:cf,evidence:'提及"'+r.al+'"'});}
  if(seen.size===0&&(srcType==='policy'||srcType==='news')){for(const [sec,kws] of Object.entries(SECTOR_KW)){const m=kws.find(k=>text.includes(k));if(!m)continue;const cf=srcType==='policy'?0.78:0.70;for(const s of STOCKS.filter(s=>s.s===sec)){if(seen.has(s.c))continue;seen.add(s.c);res.push({code:s.c,name:s.n,sector:sec,conf:cf,evidence:'主题映射"'+m+'"→'+sec});}break;}}
  return res;
}

function extractEvent(title, content, srcType) {
  const ft=title+' '+content;let et=null;
  if(srcType==='policy'&&POLICY_KW.some(k=>ft.includes(k)))et='policy_support';
  else if(srcType==='ir_qa')et=null;
  else{for(const [t,kws] of Object.entries(EVENT_KW)){if(kws.some(k=>ft.includes(k))){et=t;break;}}if(!et&&srcType==='news'&&NEWS_KW.some(k=>ft.includes(k)))et='attention_spread';}
  return et;
}

function groundPredicates(eventType, title, content, srcType, srcName, sector, evStrength) {
  const text=title+' '+content;
  const cks=CORE_PRODUCT[sector]||[];
  const mentionsCore=cks.some(k=>text.includes(k));
  const hasPolicy=eventType==='policy_support';
  const srcAuth=srcType==='policy'||srcType==='announcement'||srcType==='ir_qa'||['证券时报','上海证券报','中国证券报','21世纪经济报道'].includes(srcName);
  const attnSpike=eventType==='attention_spread'&&['装机量','装车量','渗透率','出口量','招标规模','市场关注','多家'].some(k=>text.includes(k));
  const invQ=eventType==='investor_question_pressure';
  const vague=invQ&&['以公司公告','需结合','可能影响'].some(k=>text.includes(k));
  const uncertain=srcType==='announcement'&&['不确定','风险','可能影响','提示'].some(k=>text.includes(k));
  const instAttn=['机构','调研','研报'].some(k=>text.includes(k));
  return [
    {name:'has_policy_support',val:hasPolicy,conf:hasPolicy?0.96:0.88,why:hasPolicy?'事件类型为policy_support':'非政策利好类型'},
    {name:'policy_directly_related_to_business',val:hasPolicy&&mentionsCore,conf:hasPolicy&&mentionsCore?0.90:0.78,why:hasPolicy&&mentionsCore?'明确涉及主营业务':'未明确涉及'},
    {name:'event_mentions_core_product',val:mentionsCore,conf:mentionsCore?0.88:0.74,why:mentionsCore?'提及核心产品关键词':'未显式提及'},
    {name:'evidence_from_authoritative_source',val:srcAuth,conf:srcAuth?0.94:0.72,why:'来源:'+srcName},
    {name:'social_attention_spikes',val:attnSpike,conf:attnSpike?0.82:0.68,why:attnSpike?'多源关注扩散线索':'单条来源不充分'},
    {name:'institutional_attention_increases',val:instAttn,conf:instAttn?0.76:0.70,why:instAttn?'出现机构关注线索':'未出现'},
    {name:'investor_questions_increase',val:invQ,conf:invQ?0.86:0.82,why:invQ?'提问增加':'未发现聚合证据'},
    {name:'management_response_vague',val:vague,conf:vague?0.80:0.76,why:vague?'含模糊措辞':'未发现'},
    {name:'announcement_contains_uncertainty',val:uncertain,conf:uncertain?0.84:0.78,why:uncertain?'含风险提示':'未发现'},
    {name:'event_evidence_strength',val:(evStrength||0.8).toFixed(2),conf:0.92,why:'事件抽取阶段评分'},
    {name:'event_has_short_term_price_impact',val:(PRICE_IMPACT[eventType]||0.55).toFixed(2),conf:0.70,why:'基于事件类型的先验市场反应强度'}
  ];
}

function matchRules(eventType, predMap) {
  const trig=[];
  for(const r of RULES){
    if(r.etypes.length>0&&!r.etypes.includes(eventType))continue;
    if(r.preds.every(pn=>predMap[pn]===true)){const s=RULE_STATS[r.id]||{wr:0,ar:0,score:0,n:0,pos:0};trig.push({...r,score:s.score,wr:s.wr,ar:s.ar,n:s.n,pos:s.pos});}
  }
  return trig;
}

function calcFactor(trigRules, evStrength, eventType) {
  if(trigRules.length===0)return{raw:0,factor:0};
  const raw=trigRules.reduce((s,r)=>s+r.score,0);
  const ev=(parseFloat(evStrength)||0.8);
  const impact=PRICE_IMPACT[eventType]||0.55;
  return{raw,factor:raw*(0.7*ev+0.3*impact)};
}

// ═══════════════════════════════════════════
// UI
// ═══════════════════════════════════════════
function pct(v){return typeof v==='number'?(v*100).toFixed(1)+'%':'--';}
function f4(v){return typeof v==='number'?v.toFixed(4):v;}
function pos(v){return v>0?'up':v<0?'dn':'';}
function posc(v){return v>0?'var(--green)':v<0?'var(--red)':'var(--muted)';}

function loadEx(i){const e=EXAMPLES[i];document.getElementById('ititle').value=e.t;document.getElementById('icontent').value=e.c;document.getElementById('isource').value=e.s;document.getElementById('isourcename').value=e.sn;document.getElementById('idate').value=e.d;}

async function analyze(){
  const btn=document.getElementById('runbtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Analyzing...';
  await new Promise(r=>setTimeout(r,50));
  try{
    const title=document.getElementById('ititle').value.trim();
    const content=document.getElementById('icontent').value.trim();
    const srcType=document.getElementById('isource').value;
    const srcName=document.getElementById('isourcename').value.trim()||'Unknown';
    if(!title||!content){alert('请填写标题和正文');btn.disabled=false;btn.innerHTML='&#9654; Analyze';return;}

    // Step 1: Entity Linking
    const entities=linkEntities(title,content,srcType);
    // Step 2: Event Extraction
    const eventType=extractEvent(title,content,srcType);
    if(!eventType){renderNoEvent(entities);btn.disabled=false;btn.innerHTML='&#9654; Analyze';return;}

    // Source strength
    const evStrength=Math.min((SOURCE_STR[srcType]||0.76)+(['policy_support','capacity_expansion'].includes(eventType)?0.02:0),0.98);

    // Step 3: For each linked stock, ground predicates + match rules + calc factor
    const stockResults=[];
    for(const ent of entities){
      const preds=groundPredicates(eventType,title,content,srcType,srcName,ent.sector,evStrength);
      const predMap={};preds.forEach(p=>{predMap[p.name]=p.val;});
      const trig=matchRules(eventType,predMap);
      const factor=calcFactor(trig,evStrength,eventType);
      stockResults.push({...ent,predicates:preds,trigRules:trig,factor:factor.factor,rawScore:factor.raw});
    }

    // Sort by factor descending
    stockResults.sort((a,b)=>b.factor-a.factor);

    // Step 4: Backtest from database — look up historical events of same type
    const hist=EVENT_HISTORY[eventType]||{count:0,positive:0,winRate:0,avgReturn5d:0,avgReturn10d:0,maxReturn:0,minReturn:0,avgEvidence:0,tradeDates:0};

    // Aggregate triggered rules stats
    const allTrigRules=new Map();
    for(const sr of stockResults){for(const r of sr.trigRules){allTrigRules.set(r.id,r);}}

    render({title,eventType,evStrength,entities,stockResults,hist,allTrigRules,srcType,srcName});
  }catch(e){alert('Error: '+e.message);console.error(e);}
  btn.disabled=false;btn.innerHTML='&#9654; Analyze';
}

function renderNoEvent(entities){
  const el=document.getElementById('results');document.getElementById('empty').style.display='none';el.classList.add('active');
  let h='<div class="section"><h2>分析结果</h2><div style="color:var(--muted);font-size:.84rem">未检测到明确的金融事件。当前文本可能不包含可识别的事件信号（政策利好、产能扩张、价格变动等）。</div>';
  if(entities.length>0){
    h+='<div style="margin-top:12px"><div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">但识别到以下关联实体：</div>';
    for(const e of entities)h+='<span style="display:inline-block;padding:3px 10px;margin:2px;background:var(--raised);border-radius:4px;font-family:var(--font-mono);font-size:.7rem">'+e.name+' ('+e.code+')</span>';
    h+='</div>';
  }
  h+='</div>';el.innerHTML=h;
}

function render(d){
  const el=document.getElementById('results');document.getElementById('empty').style.display='none';el.classList.add('active');
  const{sr:stocks,hist,allTrigRules,eventType,evStrength,srcType,srcName}=d;
  let h='';

  // ── KPI Row ──
  h+='<div class="kpi-row">';
  h+='<div class="kpi"><div class="kpi-val" style="color:var(--amber)">'+eventType+'</div><div class="kpi-lbl">检测事件类型</div><div class="kpi-sub">证据强度 '+(evStrength*100).toFixed(0)+'%</div></div>';
  h+='<div class="kpi"><div class="kpi-val">'+stocks.length+'</div><div class="kpi-lbl">关联股票</div><div class="kpi-sub">'+([...new Set(stocks.map(s=>s.sector))].join(' / '))+'</div></div>';
  h+='<div class="kpi"><div class="kpi-val">'+allTrigRules.size+'</div><div class="kpi-lbl">触发规则</div><div class="kpi-sub">'+([...allTrigRules.keys()].join(' / '))+'</div></div>';
  h+='<div class="kpi"><div class="kpi-val" style="color:'+posc(hist.winRate-0.5)+'">'+pct(hist.winRate)+'</div><div class="kpi-lbl">同类历史胜率</div><div class="kpi-sub">'+hist.count+' 个历史事件</div></div>';
  h+='<div class="kpi"><div class="kpi-val" style="color:'+posc(hist.avgReturn5d)+'">'+pct(hist.avgReturn5d)+'</div><div class="kpi-lbl">同类平均收益 (5d)</div><div class="kpi-sub">范围 ['+pct(hist.minReturn)+', '+pct(hist.maxReturn)+']</div></div>';
  h+='</div>';

  // ── Two column: Factor Ranking + Event History ──
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
  // Factor Ranking
  h+='<div class="section"><h2><span class="badge amber">FACTOR RANKING</span> 因子排名</h2>';
  const maxF=Math.max(...stocks.map(s=>Math.abs(s.factor)),0.001);
  for(const s of stocks){
    const w=Math.abs(s.factor)/maxF*100;
    h+='<div class="fbar"><span class="fn">'+s.name+'</span><span class="fs">'+s.sector+'</span><div class="ft"><div class="ff" style="width:'+w+'%"></div></div><span class="fv" style="color:'+posc(s.factor)+'">'+s.factor.toFixed(2)+'</span><span class="fr">'+s.trigRules.map(r=>r.id).join(' ')+'</span></div>';
  }
  h+='<div style="font-family:var(--font-mono);font-size:.62rem;color:var(--muted);margin-top:8px">因子 = sum(rule_scores) × (0.7×evidence + 0.3×price_impact_prior)</div></div>';

  // Historical Event Performance
  h+='<div class="section"><h2><span class="badge green">BACKTEST</span> 同类事件历史回测</h2>';
  h+='<div style="font-size:.78rem;color:var(--muted);margin-bottom:12px">数据库中 <b style="color:var(--text)">'+eventType+'</b> 类型共 <b style="color:var(--text)">'+hist.count+'</b> 个历史事件</div>';
  h+='<div class="hbar"><span class="hlbl">胜率</span><div class="htrk"><div class="hfl" style="width:'+(hist.winRate*100)+'%;background:var(--green)"></div></div><span class="hvl" style="color:var(--green)">'+pct(hist.winRate)+'</span></div>';
  h+='<div class="hbar"><span class="hlbl">5日平均收益</span><div class="htrk"><div class="hfl" style="width:'+Math.abs(hist.avgReturn5d)/0.04*100+'%;background:'+(hist.avgReturn5d>=0?'var(--green)':'var(--red)')+'"></div></div><span class="hvl" style="color:'+posc(hist.avgReturn5d)+'">'+pct(hist.avgReturn5d)+'</span></div>';
  h+='<div class="hbar"><span class="hlbl">10日平均收益</span><div class="htrk"><div class="hfl" style="width:'+Math.abs(hist.avgReturn10d)/0.04*100+'%;background:'+(hist.avgReturn10d>=0?'var(--green)':'var(--red)')+'"></div></div><span class="hvl" style="color:'+posc(hist.avgReturn10d)+'">'+pct(hist.avgReturn10d)+'</span></div>';
  h+='<div class="hbar"><span class="hlbl">最大收益</span><div class="htrk"><div class="hfl" style="width:'+(hist.maxReturn/0.12*100)+'%;background:#1a5c38"></div></div><span class="hvl" style="color:var(--green)">'+pct(hist.maxReturn)+'</span></div>';
  h+='<div class="hbar"><span class="hlbl">最大亏损</span><div class="htrk"><div class="hfl" style="width:'+(Math.abs(hist.minReturn)/0.12*100)+'%;background:var(--red)'></div></div><span class="hvl" style="color:var(--red)">'+pct(hist.minReturn)+'</span></div>';
  h+='<div style="font-family:var(--font-mono);font-size:.62rem;color:var(--muted);margin-top:8px">前向收益使用 event_time 之后的交易日，无未来函数</div></div>';
  h+='</div>';

  // ── Triggered Rules ──
  if(allTrigRules.size>0){
    h+='<div class="section"><h2><span class="badge amber">TRIGGERED RULES</span> 触发规则详情</h2><table class="tbl"><tr><th>ID</th><th>条件</th><th>含义</th><th>历史样本</th><th>胜率</th><th>平均收益</th><th>评分</th></tr>';
    for(const r of allTrigRules.values()){
      h+='<tr><td class="hl">'+r.id+'</td><td style="font-size:.66rem">'+r.cond+'</td><td>'+r.target+'</td><td>'+r.pos+'/'+r.n+'</td><td style="color:'+posc(r.wr-0.5)+'">'+pct(r.wr)+'</td><td style="color:'+posc(r.ar)+'">'+pct(r.ar)+'</td><td class="hl">'+r.score.toFixed(2)+'</td></tr>';
    }
    h+='</table></div>';
  }

  // ── Predicates for top stock ──
  if(stocks.length>0){
    const top=stocks[0];
    h+='<div class="section"><h2><span class="badge amber">PREDICATES</span> 谓词判断（以 '+top.name+' 为例）</h2><div class="pred-grid">';
    for(const p of top.predicates){
      const vd=typeof p.val==='boolean'?(p.val?'true':'false'):p.val;
      const vc=p.val===true?'pt':p.val===false?'pf':'';
      h+='<div class="pred-item"><span style="color:var(--muted);font-size:.7rem">'+p.name+'</span><span class="pv '+vc+'">'+vd+'</span></div>';
    }
    h+='</div></div>';
  }

  // ── Rank IC Sparkline ──
  h+='<div class="section"><h2><span class="badge green">RANK IC</span> 因子 Rank IC 序列（历史）</h2><div class="spark">';
  const maxIC=Math.max(...RANK_IC_SERIES.map(v=>Math.abs(v)),0.01);
  for(const v of RANK_IC_SERIES){h+='<div class="sp" style="height:'+(Math.abs(v)/maxIC*46+2)+'px;background:'+(v>=0?'var(--green)':'var(--red)')+'" title="'+v.toFixed(3)+'"></div>';}
  h+='</div><div class="spark-lbl"><span>2024-03</span><span>2026-06</span></div>';
  h+='<div style="font-family:var(--font-mono);font-size:.64rem;color:var(--muted);margin-top:6px">平均 Rank IC: <b style="color:var(--text)">0.0712</b> &middot; ICIR: <b style="color:var(--text)">1.84</b> &middot; 向上 = 正向预测</div></div>';

  // ── Entity Links ──
  h+='<div class="section"><h2><span class="badge amber">ENTITIES</span> 实体链接</h2><table class="tbl"><tr><th>代码</th><th>名称</th><th>行业</th><th>置信度</th><th>证据</th></tr>';
  for(const e of stocks)h+='<tr><td>'+e.code+'</td><td>'+e.name+'</td><td>'+e.sector+'</td><td>'+(e.conf*100).toFixed(0)+'%</td><td style="font-size:.68rem;color:var(--muted)">'+e.evidence+'</td></tr>';
  h+='</table></div>';

  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

document.getElementById('idate').value='2026-07-22';
</script>
